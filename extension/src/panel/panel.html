<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lantern</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <main class="panel chat">
      <header class="panel__header chat__header">
        <div>
          <h1>Lantern</h1>
          <p class="muted" id="subtitle">Check a link or a message before you act on it.</p>
        </div>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" class="lang__btn" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" class="lang__btn" data-lang="ms" aria-pressed="false">BM</button>
        </div>
      </header>

      <section id="log" class="chat__log" aria-live="polite"></section>

      <div id="starters" class="chips"></div>

      <form class="input-group chat__composer" novalidate>
        <label class="field-label" for="input" id="input-label">Paste the link or the message</label>
        <textarea
          id="input"
          rows="3"
          placeholder="For example: maybank-secure-login.xyz/login"
          spellcheck="false"
          autocomplete="off"
        ></textarea>
        <button id="check" type="button">Check</button>
        <p id="input-error" class="error" role="alert" hidden></p>
      </form>

      <details id="redaction" class="redaction" hidden>
        <summary id="redaction-title">What leaves this device</summary>
        <ul id="redaction-list"></ul>
      </details>

      <footer class="panel__footer">
        <p class="muted" id="footer">Nothing is saved. Closing this panel forgets everything.</p>
      </footer>
    </main>
    <script type="module" src="./panel.js"></script>
  </body>
</html>
