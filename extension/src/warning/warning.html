<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lantern warning</title>
    <link rel="stylesheet" href="./warning.css" />
  </head>
  <body>
    <main class="wrap">
      <p class="eyebrow">Lantern</p>
      <div class="verdict">
        <svg class="tier-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <rect x="11" y="7.5" width="2" height="6" rx="1" fill="currentColor" />
          <circle cx="12" cy="16.8" r="1.3" fill="currentColor" />
        </svg>
        <h1 id="headline">This link may be a scam</h1>
      </div>
      <p class="lead" id="sentence">
        Lantern did not finish checking this address. Treat it as unverified.
      </p>
      <p class="domain" id="domain"></p>
      <ul class="evidence" id="evidence" hidden></ul>
      <p class="copy">Someone you trust can help you check it first.</p>
      <div class="actions">
        <button id="back" class="back" type="button">Go back to safety</button>
        <a href="#" id="continue" class="continue">Continue anyway</a>
      </div>
      <p class="meta">
        What I checked: <span id="checked">not finished</span> · Request id:
        <span id="request-id" class="mono">unknown</span>
      </p>
    </main>
    <script src="./warning.js"></script>
  </body>
</html>
